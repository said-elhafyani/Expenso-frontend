<!-- Overlay Menu Mobile -->
<div class="md:hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 transition-opacity duration-300"
     [class.hidden]="!isMobileMenuOpen"
     [class.opacity-0]="!isMobileMenuOpen"
     (click)="closeMobileMenu()">
</div>

<!-- Sidebar Mobile / Desktop -->
<aside *ngIf="authService.isLoggedIn()" class="fixed md:relative top-0 left-0 z-50 md:z-10 h-full w-64 bg-surface border-r border-slate-200 shadow-xl md:shadow-sm transform transition-transform duration-300 ease-in-out flex flex-col md:translate-x-0"
       [ngClass]="{'translate-x-0': isMobileMenuOpen, '-translate-x-full': !isMobileMenuOpen}">
    <div class="p-6 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary to-secondary flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-200">
            <i class="fa-solid fa-wallet"></i>
        </div>
        <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">Expenso</span>
    </div>

    <nav class="flex-1 px-4 py-4 space-y-2 overflow-y-auto">
        <a routerLink="/dashboard" routerLinkActive="active bg-indigo-50 text-primary" [routerLinkActiveOptions]="{exact: true}"
           (click)="closeMobileMenu()"
           class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-colors hover:bg-slate-50 text-slate-500">
            <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
        </a>
        <a routerLink="/history" routerLinkActive="active bg-indigo-50 text-primary"
           (click)="closeMobileMenu()"
           class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-colors hover:bg-slate-50 text-slate-500">
            <i class="fa-solid fa-list w-5"></i> Historique
        </a>
        <a routerLink="/stats" routerLinkActive="active bg-indigo-50 text-primary"
           (click)="closeMobileMenu()"
           class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-colors hover:bg-slate-50 text-slate-500">
            <i class="fa-solid fa-chart-line w-5"></i> Statistiques
        </a>
        <a *ngIf="authService.isAdmin()" routerLink="/admin" routerLinkActive="active bg-indigo-50 text-primary"
           (click)="closeMobileMenu()"
           class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-colors hover:bg-slate-50 text-slate-500">
            <i class="fa-solid fa-users-gear w-5"></i> Administration
        </a>
    </nav>

    <div class="p-4 border-t border-slate-100">
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors">
            <i class="fa-solid fa-gear w-5"></i> Paramètres
        </a>
        <div class="mt-4 flex items-center gap-3 px-4">
            <div class="w-10 h-10 rounded-full bg-primary text-white flex items-center justify-center font-bold shadow-sm">
                {{ currentUser?.name?.charAt(0) | uppercase }}
            </div>
            <div class="flex-1">
                <p class="text-sm font-semibold text-slate-800">{{ currentUser?.name }}</p>
                <p class="text-xs text-slate-500">{{ currentUser?.role === 'ADMIN' ? 'Administrateur' : 'Client' }}</p>
            </div>
            <button (click)="logout()" class="text-slate-400 hover:text-red-500 transition-colors">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </button>
        </div>
    </div>
</aside>

<main class="flex-1 flex flex-col h-full overflow-hidden bg-background relative">
    
    <!-- Header -->
    <header *ngIf="authService.isLoggedIn()" class="glass-effect border-b border-slate-200 px-6 py-4 flex justify-between items-center sticky top-0 z-20">
        <div>
            <h1 class="text-2xl font-bold text-slate-800">{{ pageTitle }}</h1>
            <p class="text-sm text-slate-500">Septembre 2026</p>
        </div>
        <div class="flex items-center gap-4">
            <button (click)="toggleMobileMenu()" class="md:hidden w-10 h-10 rounded-full bg-white border border-slate-200 text-slate-600 flex items-center justify-center relative">
                <i class="fa-solid fa-bars"></i>
            </button>
            <button class="hidden md:flex w-10 h-10 rounded-full bg-white border border-slate-200 text-slate-600 hover:text-primary hover:border-primary transition-colors flex items-center justify-center relative">
                <i class="fa-regular fa-bell"></i>
                <span class="absolute top-2 right-2 w-2 h-2 bg-accent rounded-full"></span>
            </button>
            <button (click)="openModal()" class="hidden md:flex bg-gradient-to-r from-primary to-secondary hover:opacity-90 text-white px-5 py-2.5 rounded-full font-medium items-center gap-2 transition-transform active:scale-95 shadow-lg shadow-indigo-200">
                <i class="fa-solid fa-plus"></i> Nouvelle Transaction
            </button>
        </div>
    </header>

    <!-- Contenu Dynamique (Router Outlet) -->
    <div class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8">
        <router-outlet></router-outlet>
    </div>
</main>

<!-- FAB Mobile -->
<button (click)="openModal()" class="md:hidden fixed bottom-6 right-6 w-14 h-14 bg-gradient-to-r from-primary to-secondary text-white rounded-full shadow-lg shadow-indigo-300 flex items-center justify-center text-xl z-30 active:scale-90 transition-transform">
    <i class="fa-solid fa-plus"></i>
</button>

<!-- Modal d'ajout de dépense (Géré par Angular avec [class.hidden]) -->
<div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity duration-300"
     [class.hidden]="!isModalOpen"
     [class.opacity-0]="!isModalOpen"
     [class.pointer-events-none]="!isModalOpen">
    
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden transform transition-transform duration-300"
         [class.scale-95]="!isModalOpen"
         [class.scale-100]="isModalOpen">
        
        <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
            <h2 class="text-xl font-bold text-slate-800">Nouvelle Transaction</h2>
            <button (click)="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-slate-800 flex items-center justify-center transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form class="p-6 space-y-5" (submit)="onSubmit($event)">
            
            <!-- Choix du Type -->
            <div class="flex p-1 bg-slate-100 rounded-xl">
                <button type="button" (click)="setType('EXPENSE')" [ngClass]="newTransaction.type === 'EXPENSE' ? 'bg-white shadow-sm text-slate-800 font-semibold' : 'text-slate-500 hover:text-slate-700'" class="flex-1 py-2 rounded-lg text-sm transition-all">
                    <i class="fa-solid fa-arrow-trend-down text-red-500 mr-1" *ngIf="newTransaction.type === 'EXPENSE'"></i> Sortie
                </button>
                <button type="button" (click)="setType('INCOME')" [ngClass]="newTransaction.type === 'INCOME' ? 'bg-white shadow-sm text-slate-800 font-semibold' : 'text-slate-500 hover:text-slate-700'" class="flex-1 py-2 rounded-lg text-sm transition-all">
                    <i class="fa-solid fa-arrow-trend-up text-emerald-500 mr-1" *ngIf="newTransaction.type === 'INCOME'"></i> Entrée
                </button>
            </div>

            <div class="text-center mb-6">
                <label class="block text-sm font-medium text-slate-500 mb-2">Montant (DH)</label>
                <div class="relative inline-block">
                    <input type="number" id="amount" name="amount" [(ngModel)]="newTransaction.amount" required step="0.01" placeholder="0.00" class="text-4xl font-bold text-slate-800 bg-transparent border-none outline-none text-center w-full focus:ring-0 p-0 placeholder-slate-300" style="-moz-appearance: textfield;">
                    <div class="h-0.5 bg-slate-200 w-full mt-1"></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Date</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-regular fa-calendar"></i>
                        </div>
                        <input type="date" name="date" [(ngModel)]="newTransaction.date" required class="block w-full pl-10 pr-3 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary bg-slate-50 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Catégorie</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-tags"></i>
                        </div>
                        <select *ngIf="newTransaction.type === 'EXPENSE'" name="category" [(ngModel)]="newTransaction.category" required class="block w-full pl-10 pr-8 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary bg-slate-50 text-sm appearance-none">
                            <option *ngFor="let cat of expenseCategories" [value]="cat">{{ cat }}</option>
                        </select>
                        <select *ngIf="newTransaction.type === 'INCOME'" name="category" [(ngModel)]="newTransaction.category" required class="block w-full pl-10 pr-8 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary bg-slate-50 text-sm appearance-none">
                            <option *ngFor="let cat of incomeCategories" [value]="cat">{{ cat }}</option>
                        </select>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Raison</label>
                <input type="text" name="reason" [(ngModel)]="newTransaction.reason" required placeholder="Ex: Restaurant, Salaire..." class="block w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary bg-slate-50 text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Note (Optionnel)</label>
                <textarea name="note" [(ngModel)]="newTransaction.note" rows="2" placeholder="Détails supplémentaires..." class="block w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary bg-slate-50 text-sm resize-none"></textarea>
            </div>

            <div class="pt-4 flex gap-3">
                <button type="button" (click)="closeModal()" class="flex-1 px-4 py-3 rounded-xl border border-slate-200 text-slate-600 font-medium hover:bg-slate-50 transition-colors">
                    Annuler
                </button>
                <button type="submit" class="flex-1 px-4 py-3 rounded-xl bg-primary hover:bg-indigo-700 text-white font-medium shadow-md shadow-indigo-200 transition-colors flex justify-center items-center gap-2">
                    <i class="fa-solid fa-check"></i> Enregistrer
                </button>
            </div>
        </form>
    </div>
</div>
